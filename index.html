<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دمي - الحامي والمقد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body class="bg-[#FFF8F8] min-h-screen">
<!-- نفس الهيكل السابق (يوجد أدناه) -->

</div>

<script>
// ==================== إعدادات Supabase ====================
const SUPABASE_URL = 'https://sncymicxpwxyfmxtqoiv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ax-vLH9J3LHOvUiD8NkYQg_5KKotYrX';

let supabaseClient = null;
let isOnline = false;
let users = [];
let currentUser = null;
let notifications = JSON.parse(localStorage.getItem('dami_notifs') || '[]');
let areaFilter = 'all';
let bloodFilter = 'all';
let editTarget = null;
let notifType = 'urgent';

// ==================== تهيئة العميل بعد تحميل المكتبة ====================
function initSupabase() {
  try {
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      console.log('✅ Supabase client initialized');
      return true;
    } else {
      console.warn('⚠️ Supabase library not loaded yet');
      return false;
    }
  } catch(e) {
    console.error('❌ Failed to init Supabase:', e);
    return false;
  }
}

// ==================== اختبار الاتصال ====================
async function testConnection() {
  if (!supabaseClient) {
    updateBadgeStatus('❌ العميل غير مهيأ', 'bg-red-100 text-red-700');
    return false;
  }
  try {
    const { data, error } = await supabaseClient.from('donors').select('count', { count: 'exact', head: true });
    if (error) {
      console.error('❌ Supabase error:', error);
      if (error.message.includes('relation "donors" does not exist')) {
        updateBadgeStatus('❌ الجدول donors غير موجود', 'bg-red-100 text-red-700');
      } else if (error.message.includes('permission denied')) {
        updateBadgeStatus('❌ سياسات RLS تمنع الوصول', 'bg-red-100 text-red-700');
      } else {
        updateBadgeStatus('❌ فشل الاتصال: ' + error.message, 'bg-red-100 text-red-700');
      }
      return false;
    }
    console.log('✅ Connected to Supabase, count:', data);
    updateBadgeStatus('🌐 أونلاين - مرتبط بـ Supabase', 'bg-green-100 text-green-700');
    isOnline = true;
    return true;
  } catch(e) {
    console.error('❌ Connection test failed:', e);
    updateBadgeStatus('❌ فشل الاتصال بالخادم', 'bg-red-100 text-red-700');
    return false;
  }
}

// ==================== تحميل البيانات من Supabase ====================
async function loadFromSupabase() {
  if (!supabaseClient) return false;
  try {
    const { data, error } = await supabaseClient.from('donors').select('*').order('created_at', { ascending: true });
    if (error) throw error;
    if (data && data.length > 0) {
      users = data.map(d => ({
        id: d.id,
        name: d.name,
        username: d.username,
        pass: d.pass,
        phone: d.phone || '',
        blood: d.blood || 'O+',
        area: d.area || 'الحامي',
        hood: d.hood || '',
        last: d.last_donation || new Date().toISOString().slice(0,10),
        status: d.status || 'متاح الآن',
        reason: d.reason || '',
        role: d.role || 'donor'
      }));
      // إضافة المدير إذا لم يكن موجوداً
      if (!users.find(u => u.username === 'admin')) {
        users.unshift({
          name: 'المدير العام',
          username: 'admin',
          pass: localStorage.getItem('dami_admin_pass_v2') || 'admin777',
          phone: '775233773',
          blood: 'AB+',
          area: 'الحامي',
          hood: 'الإدارة',
          last: new Date().toISOString().slice(0,10),
          status: 'متاح الآن',
          reason: '',
          role: 'admin'
        });
      }
      saveLocal();
      render();
      updateAuth();
      renderNotifs();
      updateBadge();
      return true;
    } else {
      // لا توجد بيانات في السحاب → نستخدم المحلي
      return false;
    }
  } catch(e) {
    console.warn('⚠️ Failed to load from Supabase:', e);
    return false;
  }
}

// ==================== دوال الحفظ والمزامنة ====================
function saveLocal() {
  localStorage.setItem('dami_users_v2', JSON.stringify(users));
}

async function syncAllToSupabase() {
  if (!supabaseClient || !isOnline) return;
  for (const u of users) {
    if (u.role === 'admin') continue;
    try {
      const payload = {
        name: u.name,
        username: u.username,
        pass: u.pass,
        phone: u.phone || '',
        blood: u.blood || 'O+',
        area: u.area || 'الحامي',
        hood: u.hood || '',
        last_donation: u.last || new Date().toISOString().slice(0,10),
        status: u.status || 'متاح الآن',
        reason: u.reason || '',
        role: 'donor'
      };
      const { data: existing, error: findErr } = await supabaseClient
        .from('donors')
        .select('id')
        .eq('username', u.username)
        .maybeSingle();
      if (findErr) throw findErr;
      if (existing) {
        await supabaseClient.from('donors').update(payload).eq('username', u.username);
      } else {
        await supabaseClient.from('donors').insert(payload);
      }
    } catch(e) {
      console.warn('⚠️ Sync failed for', u.username, e);
    }
  }
}

async function saveAll() {
  saveLocal();
  if (supabaseClient && isOnline) {
    await syncAllToSupabase();
  }
  render();
  updateAuth();
}

// ==================== التهيئة الرئيسية ====================
async function init() {
  // تهيئة العميل
  const ok = initSupabase();
  if (!ok) {
    // حاول مجدداً بعد ثانية (في حال تأخر تحميل المكتبة)
    setTimeout(() => {
      initSupabase();
      testConnection().then(connected => {
        if (connected) loadFromSupabase();
        else loadFallback();
      });
    }, 1000);
  } else {
    const connected = await testConnection();
    if (connected) {
      const loaded = await loadFromSupabase();
      if (!loaded) loadFallback();
    } else {
      loadFallback();
    }
  }
  // استعادة المستخدم الحالي
  const saved = localStorage.getItem('dami_current_v2');
  if (saved) {
    try { currentUser = JSON.parse(saved); } catch(e) { currentUser = null; }
  }
  render();
  updateAuth();
  renderNotifs();
  updateBadge();
}

function loadFallback() {
  const local = localStorage.getItem('dami_users_v2');
  if (local) {
    try { users = JSON.parse(local); } catch(e) { users = []; }
  }
  if (!users || users.length === 0) {
    users = [
      { name: 'المدير العام', username: 'admin', pass: 'admin777', phone: '775233773', blood: 'AB+', area: 'الحامي', hood: 'الإدارة', last: '2024-01-01', status: 'متاح الآن', reason: '', role: 'admin' },
      { name: 'أحمد باعمر', username: 'ahmed_hami', pass: '1234', phone: '777123456', blood: 'O+', area: 'الحامي', hood: 'السوق', last: '2024-02-10', status: 'متاح الآن', reason: '', role: 'donor' },
      { name: 'صالح الجمحي', username: 'saleh_maqd', pass: '1234', phone: '777654321', blood: 'A+', area: 'المقد', hood: 'الجامع', last: '2024-01-20', status: 'غير متاح', reason: 'مسافر خارج المنطقة حالياً', role: 'donor' }
    ];
    saveLocal();
  }
  updateBadgeStatus('📱 وضع غير متصل (محلي)', 'bg-amber-100 text-amber-700');
}

function updateBadgeStatus(text, className) {
  const badge = document.getElementById('onlineBadge');
  if (badge) {
    badge.textContent = text;
    badge.className = `text-[10px] px-3 py-1 rounded-full font-black ${className}`;
  }
}

// ==================== باقي الدوال (نفسها مع تعديل saveAll) ====================
// ... (جميع الدوال الأخرى كما هي، مع استبدال save() بـ saveAll() حيثما ورد)
// لكن لكي لا نطيل، سأضع الكود الكامل في الرد التالي ...
</script>
</body>
</html>
